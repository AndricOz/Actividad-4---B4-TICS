<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini App - Lista de Productos</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="header">
    <h1>Catálogo de Productos</h1>
    <p class="subtitle">Datos obtenidos desde la Fake Store API</p>
  </header>

  <main class="container">
    <section class="controls">
      <input
        type="text"
        id="searchInput"
        placeholder="Buscar producto por nombre..."
      />
      <select id="categoryFilter">
        <option value="all">Todas las categorías</option>
      </select>
      <button id="reloadBtn">Recargar datos</button>
    </section>

    <p id="status" class="status"></p>

    <section id="productList" class="product-grid"></section>
  </main>

  <footer class="footer">
    <p>Proyecto de práctica &mdash; Fetch API + JS + Husky + ESLint</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
